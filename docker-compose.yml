services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tours
      POSTGRES_PASSWORD: tours
      POSTGRES_DB: tour_studio
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tours -d tour_studio"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
